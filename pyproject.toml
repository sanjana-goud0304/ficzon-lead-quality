[project]
name = "ficzon-lead-quality"
version = "0.1.0"
description = "Lead quality prediction and sales effectiveness analysis (portfolio project)"
requires-python = ">=3.11"
dependencies = ["pandas>=3.0", "numpy>=2.4", "scikit-learn>=1.8", "matplotlib>=3.8", "seaborn>=0.13", "pyyaml>=6.0", "tabulate>=0.9", "scipy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
